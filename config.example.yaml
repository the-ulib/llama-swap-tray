# llama-swap configuration - EXAMPLE
# Copy this file to config.yaml and adjust every REPLACE-ME path before running
# setup\03-server-task.ps1. Full reference:
# https://github.com/mostlygeek/llama-swap/blob/main/docs/configuration.md
#
# Notes that will save you time (learned the hard way, see README "Troubleshooting"):
# - Group membership goes into the "members:" list INSIDE the group. A "group:" key
#   on a model entry parses fine but is silently ignored and wedges the swap logic.
# - Every entry whose launcher spawns child processes (Python venv stubs, pip console
#   scripts, most AI apps) needs "cmdStop: taskkill /f /t /pid ${PID}" - otherwise
#   stopping only kills the stub and the real process keeps the port and the VRAM.
# - Vision needs the projector loaded explicitly: add --mmproj <mmproj-*.gguf>
#   next to -m, or the model starts text-only.

macros:
  # absolute path to llama-server inside this repo's bin folder
  llama: REPLACE-ME\llama-swap-tray\bin\llama.cpp\llama-server.exe

models:
  # ---- your main LLM (swapped in and out on demand) -------------------------
  my-large-model:
    cmd: >
      ${llama} --port ${PORT}
      -m "REPLACE-ME\models\your-model-Q4_K_M.gguf"
      -c 32768 -ngl 99 -fa on --jinja
    ttl: 300                # unload after 5 min idle -> frees VRAM
    # useful extra flags:
    #   --mmproj "...mmproj-*.gguf"   vision support (projector file next to the GGUF)
    #   -ctk q4_0 -ctv q4_0           quantized KV cache (much larger context per GB)
    #   --parallel 4 --kv-unified     several concurrent requests sharing one context pool
    #   -t 12 -b 2048 -ub 512         threads / batch sizes

  # ---- a small always-loaded model (fits alongside everything else) ---------
  my-small-model:
    cmd: >
      ${llama} --port ${PORT}
      -m "REPLACE-ME\models\your-small-model-Q4_K_M.gguf"
      -c 16384 -ngl 99 -fa on --jinja
    ttl: 0                  # never auto-unload

  # ---- example: another GPU app managed by llama-swap (here: ComfyUI) -------
  # Any app can join the swap group: llama-swap starts it on demand, stops it
  # when an LLM needs the VRAM, and proxies it at /upstream/<name>/.
  #comfyui:
  #  cmd: >
  #    REPLACE-ME\ComfyUI\venv\Scripts\python.exe
  #    REPLACE-ME\ComfyUI\main.py
  #    --listen 0.0.0.0 --port 8188 --disable-smart-memory
  #  cmdStop: taskkill /f /t /pid ${PID}     # kill the WHOLE process tree
  #  proxy: http://127.0.0.1:8188
  #  checkEndpoint: /
  #  ttl: 600

groups:
  gpu-heavy:
    swap: true              # members are mutually exclusive (one at a time)
    exclusive: false        # do not evict other groups (keeps the small model alive)
    members:
      - "my-large-model"
      #- "comfyui"
  always-on:
    swap: false
    exclusive: false
    persistent: true        # survives gpu-heavy swaps
    members:
      - "my-small-model"
